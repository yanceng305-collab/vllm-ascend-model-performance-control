# Hardware Normalization Configuration

# This file provides the authoritative machine-readable hardware compute basis
# and normalization policy per Decision D-020 and Decision D-023.
# All Formal Result generators and validators MUST use values from this file.
# Manual transcription is prohibited.

# A3/910C Configuration
a3:
  cards: 8
  tflops_per_card_fp16: 756  # FP16 precision suitable for W8A8 comparison
  total_tflops: 6048  # MUST equal cards × tflops_per_card_fp16

# H100 Configuration (Customer Baseline)
h100:
  cards: 16
  tflops_per_card_fp8: 989  # FP8 precision (customer baseline)
  total_tflops: 15824  # MUST equal cards × tflops_per_card_fp8

# Normalization Policy
normalization:
  # Achievement = (A3_throughput / A3_total_tflops) / (H100_throughput / H100_total_tflops)
  target_achievement_minimum: 0.80  # 80% normalized target

# Decision Provenance
metadata:
  decision_id: "D-020"
  effective_date: "2026-09-01"
  validation_decision_id: "D-023"
  validation_effective_date: "2026-09-02"

# Validation Rules (checked by validators):
# - a3.cards × a3.tflops_per_card_fp16 MUST == a3.total_tflops
# - h100.cards × h100.tflops_per_card_fp8 MUST == h100.total_tflops
# - Any other formulation (e.g., "8 × 1979 = 15824") MUST be rejected
